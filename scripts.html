<script>
(() => {
  document.querySelectorAll('[data-year]').forEach(el => el.textContent = new Date().getFullYear());
  const els=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');o.unobserve(e.target)}}),{threshold:.08});els.forEach(el=>o.observe(el));}else{els.forEach(el=>el.classList.add('is-visible'));}
})();
</script>
