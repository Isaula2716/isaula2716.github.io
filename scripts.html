<script>
(() => {
  document.querySelectorAll('[data-year]').forEach(el => {
    el.textContent = new Date().getFullYear();
  });

  const els = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('is-visible');
        obs.unobserve(e.target);
      }
    }), { threshold: .10 });
    els.forEach(el => obs.observe(el));
  } else {
    els.forEach(el => el.classList.add('is-visible'));
  }

  // Mobile navigation
  document.querySelectorAll('.topbar').forEach(header => {
    const nav = header.querySelector('.topnav');
    const lang = header.querySelector('.lang');
    if (!nav || !lang || header.querySelector('.mobile-menu-toggle')) return;

    const button = document.createElement('button');
    button.className = 'mobile-menu-toggle';
    button.type = 'button';
    button.setAttribute('aria-label', 'Abrir menú');
    button.setAttribute('aria-expanded', 'false');
    button.innerHTML = '<span></span><span></span>';

    header.insertBefore(button, lang);

    const closeMenu = () => {
      nav.classList.remove('mobile-open');
      button.classList.remove('is-open');
      button.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('mobile-nav-open');
    };

    button.addEventListener('click', () => {
      const open = !nav.classList.contains('mobile-open');
      nav.classList.toggle('mobile-open', open);
      button.classList.toggle('is-open', open);
      button.setAttribute('aria-expanded', String(open));
      document.body.classList.toggle('mobile-nav-open', open);
    });

    nav.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeMenu();
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 940) closeMenu();
    });
  });
})();
</script>
